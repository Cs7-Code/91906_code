[project]
name = "91906-code"
version = "1.0.0"
description = ""
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Timothy Das-Tracey", email = "22269@students.lynfield.school.nz" }
]
dependencies = [
    "argon2-cffi>=25.1.0",
    "faker>=40.35.0",
    "flet>=1.0.1",
    "flet-math>=0.1.1",
    "matplotlib>=3.10.9",
    "pdfplumber>=0.11.10",
    "pydantic>=2.13.4",
    "pyinstaller>=6.22.1",
    "pymupdf>=1.28.2",
    "sqlalchemy>=2.0.52",
    "sqlmodel>=0.0.39",
    "sympy>=1.14.0",
    "zxcvbn-python>=4.4.24",
]

[dependency-groups]
dev = [
    "flet-cli>=0.86.1",
    "flet-desktop>=0.86.1",
    "flet-web>=0.86.1",
    # Integration testing with `flet test` / pytest. The `test` extra brings in
    # pytest, pytest-asyncio and the screenshot-comparison dependencies.
    "flet[test]>=0.86.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.flet]
org = "com.mycompany"
product = "91906-code"
company = "Flet"
copyright = "Copyright (C) 2023-2026 by Flet"

[tool.flet.app]
path = "src"
